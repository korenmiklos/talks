# Launch with `make omp`; it runs from demo/ under the isolated corvinus-training profile.
# Authenticate that profile with `make omp-login`, or set TRAINING_OPENROUTER_API_KEY for one launch.
# This overlay applies only to the training session and does not modify normal OMP settings.
skills:
  enabled: false
advisor:
  enabled: false
memory:
  backend: off
autolearn:
  enabled: false
disabledProviders:
  - native
  - omp-plugins
  - claude
  - claude-plugins
  - agent-plugins
  - codex
  - agents
  - gemini
  - opencode
  - cursor
  - windsurf
  - cline
  - github
  - vscode
  - agents-md
  - claude-md
  - custom-context
  - mcp-json
  - ssh-json
  - builtin-defaults
